<!DOCTYPE html>
<!--
  Diário de Pesquisa — index.html
  [v1.1] arquivo criado quando o app ficou independente do claude.ai.
  [v2.0] barra superior, abas com ícones e botão + redesenhados (novo visual).
  Histórico completo de versões: topo do app.js.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- [v2.0] cor da barra do celular e suporte a modo claro/escuro -->
<meta name="theme-color" content="#12301f">
<meta name="color-scheme" content="light dark">
<!-- [v1.1] abrir como app (tela cheia) quando instalado na tela inicial -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diário">
<title>Diário de Pesquisa — Sistemática</title>
<!-- [v1.1] manifesto e ícones (instalável) -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<!-- [v2.1] aplica o tema escolhido antes de desenhar (evita piscar) -->
<script>/* tema escolhido no menu, aplicado antes de desenhar a tela */try{var t=localStorage.getItem("diario-tema");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
</head>
<body>
<div id="shell">
  <!-- [v2.0] barra superior: seta de voltar, logo de besouro, título e menu ⋮ -->
  <header id="bar">
    <button id="bk" data-a="navback" hidden aria-label="Voltar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></button>
    <span id="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 4.8 9.4 2.7M12.9 4.8l1.7-2.1" fill="none" stroke-width="1.4"/><ellipse cx="12" cy="6" rx="1.9" ry="1.4" stroke="none"/><rect x="8.3" y="7.6" width="7.4" height="3" rx="1.2" stroke="none"/><path d="M12 11.4c-3.3 0-4.6 1.7-4.6 4.4 0 3.3 2.1 5.7 4.6 5.7s4.6-2.4 4.6-5.7c0-2.7-1.3-4.4-4.6-4.4z" stroke="none"/><path d="M12 11.6v9.6" stroke="#e2ae55" stroke-width="1"/><path d="M8.4 9.4 6 8.3l-.8-1.7M15.6 9.4 18 8.3l.8-1.7M7.5 13.5l-2.8-.4-1 1.6M16.5 13.5l2.8-.4 1 1.6M8 17.6l-2.4 1.1-.3 2M16 17.6l2.4 1.1.3 2" fill="none" stroke-width="1.4"/></svg></span>
    <h1 id="ttl">Diário de Pesquisa</h1>
    <button id="mn" data-a="menu" aria-label="Mais opções"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5.5" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="12" cy="18.5" r="1.8"/></svg></button>
  </header>
  <main id="app"></main>
  <!-- abas de baixo: Grupos e Painel [v1.0] · Agenda [v1.8] · Contagem [v1.4] · ícones desenhados [v2.0] -->
  <nav id="tabs">
    <button data-a="tab" data-i="g"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11.1 4.8 9.4 2.7M12.9 4.8l1.7-2.1"/><ellipse cx="12" cy="6" rx="1.9" ry="1.4"/><rect class="fl" x="8.3" y="7.9" width="7.4" height="2.8" rx="1.1"/><path class="fl" d="M12 11.3c-3.3 0-4.5 1.7-4.5 4.4 0 3.3 2 5.6 4.5 5.6s4.5-2.3 4.5-5.6c0-2.7-1.2-4.4-4.5-4.4z"/><path d="M12 11.3v10M8.4 9.4 6 8.3l-.8-1.7M15.6 9.4 18 8.3l.8-1.7M7.6 13.5l-2.8-.4-1 1.6M16.4 13.5l2.8-.4 1 1.6M8 17.6l-2.4 1.1-.3 2M16 17.6l2.4 1.1.3 2"/></svg></span>Grupos</button>
    <button data-a="tab" data-i="p"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect class="fl" x="3.5" y="3.5" width="7" height="9" rx="1.6"/><rect x="13.5" y="3.5" width="7" height="5" rx="1.6"/><rect class="fl" x="13.5" y="11.5" width="7" height="9" rx="1.6"/><rect x="3.5" y="15.5" width="7" height="5" rx="1.6"/></svg></span>Painel</button>
    <button data-a="tab" data-i="a"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect class="fl" x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 9.8h17M8 3v4M16 3v4"/><path d="M8 13.6h.01M12 13.6h.01M16 13.6h.01M8 17h.01M12 17h.01" stroke-width="2.4"/></svg></span>Agenda</button>
    <button data-a="tab" data-i="c"><span class="ti"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5h12M6 20.5h12"/><path class="fl" d="M7.5 3.5c0 4.2 4.5 5.4 4.5 8.5s-4.5 4.3-4.5 8.5h9c0-4.2-4.5-5.4-4.5-8.5s4.5-4.3 4.5-8.5z"/></svg></span>Contagem</button>
  </nav>
</div>
<!-- [v2.0] botão + flutuante -->
<button id="fab" data-a="" hidden aria-label="Adicionar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<!-- menu ⋮ (visual v2.0) -->
<div id="scrim" data-a="menu" hidden></div>
<div id="menu" hidden>
  <!-- [v2.1] Relatório do período e Organizar -->
  <button data-a="tab" data-i="r"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3.5H7a1.5 1.5 0 0 0-1.5 1.5v14A1.5 1.5 0 0 0 7 20.5h10a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3.5V8h4.5M9 12.5h6M9 16h4"/></svg>Relatório do período</button>
  <button data-a="tab" data-i="o"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 20V4M4.5 7.5 8 4l3.5 3.5M16 4v16M12.5 16.5 16 20l3.5-3.5"/></svg>Organizar (arrastar e A–Z)</button>
  <!-- [v2.2] Google Agenda -->
  <button data-a="tab" data-i="k"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.6"/><path d="M3.5 9.8h17M8 3v4M16 3v4M9 15h6M12.5 12.5 15 15l-2.5 2.5"/></svg>Google Agenda (trazer e enviar)</button>
  <!-- [v1.2] Modelos de atividades · [v1.1] Backup e restauração -->
  <button data-a="tab" data-i="m"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 3.5 8 12 12.5 20.5 8z"/><path d="m3.5 12 8.5 4.5 8.5-4.5M3.5 16l8.5 4.5 8.5-4.5"/></svg>Modelos de atividades</button>
  <button data-a="tab" data-i="b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4" width="17" height="5" rx="1.3"/><path d="M5 9v9.5c0 .8.7 1.5 1.5 1.5h11c.8 0 1.5-.7 1.5-1.5V9M10 13h4"/></svg>Backup e restauração</button>
  <hr>
  <!-- [v2.1] Tema: automático, claro ou escuro -->
  <div id="thm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg>Tema<span class="tsel"><button data-a="theme" data-i="">Auto</button><button data-a="theme" data-i="light">Claro</button><button data-a="theme" data-i="dark">Escuro</button></span></div>
  <hr>
  <!-- [v1.10] Sobre o app -->
  <button data-a="tab" data-i="s"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5.5M12 7.8v.1" stroke-width="2"/></svg>Sobre o app</button>
</div>
<!-- [v1.0] janela de formulário · [v1.1?] aviso rápido (toast) -->
<div id="modal"></div><div id="toast"></div>
<script src="app.js"></script>
</body>
</html>
